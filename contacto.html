<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- @head -->
    <title>Contacto | Gamfire Chile</title>
</head>

<body>
    <!-- @header -->
    <div id="app">
        <main id="main-content" class="page-content py-lg">
            <div class="container contact-container">
                <h1>Contáctanos</h1>
                <div class="contact-grid">
                    <div class="contact-info">
                        <h3>Información</h3>
                        <p>Si tienes dudas sobre stock o envíos, escríbenos directamente.</p>
                        <br>
                        <p><strong>WhatsApp:</strong> <a href="https://wa.me/56979684064" target="_blank" rel="noopener">+56 9 7968 4064</a></p>
                        <p><strong>Facebook:</strong> <a href="https://www.facebook.com/minibomberito" target="_blank" rel="noopener">Gam Fire Chile - Mi Bomberito</a></p>
                        <p><strong>Instagram:</strong> <a href="https://instagram.com/gamfire.chile" target="_blank" rel="noopener">@gamfire.chile</a>
                        </p>
                        <p><strong>Email:</strong> <a href="mailto:gamfirechile@gmail.com">gamfirechile@gmail.com</a></p>
                        <br>
                        <div class="map-placeholder"
                            style="background:#eee; height: 200px; display:flex; align-items:center; justify-content:center; border-radius: 4px;">
                            Mapa de ubicación
                        </div>
                    </div>

                    <form class="contact-form" novalidate>
                        <div id="form-feedback" class="form-feedback" role="alert" aria-live="polite"></div>
                        <div class="form-group">
                            <label for="name">Nombre Completo</label>
                            <input type="text" id="name" name="name" autocomplete="name" required placeholder="Tu nombre">
                        </div>
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <input type="email" id="email" name="email" autocomplete="email" inputmode="email" required placeholder="tu@correo.com">
                        </div>
                        <div class="form-group">
                            <label for="message">Mensaje</label>
                            <textarea id="message" name="message" rows="5" required placeholder="Escribe tu consulta aquí..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Enviar Mensaje</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <!-- @footer -->
    <script type="module" src="/src/main.js"></script>
</body>

</html>
